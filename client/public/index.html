<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>RemoteDesk</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <header>
      <h1>RemoteDesk</h1>
      <span id="status" class="status">disconnected</span>
    </header>

    <section id="login" class="panel">
      <div class="row">
        <label>
          Connection&nbsp;ID
          <input id="id" inputmode="numeric" maxlength="9" placeholder="123456789" autocomplete="off" />
        </label>
        <label>
          PIN
          <input id="pin" inputmode="numeric" maxlength="12" placeholder="0000" autocomplete="off" />
        </label>
        <button id="connect">Connect</button>
      </div>
      <p class="hint">
        Run the host agent on the computer you want to control. It will print
        a Connection ID and ask you to set a PIN.
      </p>
    </section>

    <section id="session" class="panel hidden">
      <div class="toolbar">
        <button id="fullscreen">Fullscreen</button>
        <button id="disconnect" class="danger">Disconnect</button>
        <span id="info" class="info"></span>
      </div>
      <div id="stage" class="stage" tabindex="0">
        <video id="screen" autoplay playsinline muted></video>
      </div>
    </section>

    <script type="module" src="app.js"></script>
  </body>
</html>
