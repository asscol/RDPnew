name: Host CI (Linux)

on:
  push:
    branches: [main]
    paths:
      - "host/**"
      - ".github/workflows/host-ci.yml"
  pull_request:
    paths:
      - "host/**"
      - ".github/workflows/host-ci.yml"

jobs:
  lint-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install OS deps for av/aiortc
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libavdevice-dev libavfilter-dev libopus-dev libvpx-dev pkg-config \
            libxtst-dev libx11-dev
      - name: Install host package
        working-directory: host
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
      - name: Lint
        working-directory: host
        run: ruff check remotedesk
      - name: Tests
        working-directory: host
        run: python -m pytest tests -q
