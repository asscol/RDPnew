# Minimal coturn config for RemoteDesk.
#
# Replace ${PUBLIC_HOST} and ${TURN_SECRET} via envsubst before deploying:
#   envsubst < coturn.conf > /etc/coturn/turnserver.conf
#
# Key features:
#  * STUN + TURN on UDP/TCP 3478
#  * TURNS (TLS) on 5349 — point fingerprint+cert paths at your Let's Encrypt files
#  * use-auth-secret: time-limited credentials issued by the signaling server,
#    no static usernames stored on disk
#  * Relay range 49160-49200 (open these in your firewall / security group)

listening-port=3478
tls-listening-port=5349

# Bind to all interfaces.
listening-ip=0.0.0.0

# Public-facing IP/hostname clients see in the relay candidate.
realm=${PUBLIC_HOST}
server-name=${PUBLIC_HOST}
external-ip=${PUBLIC_HOST}

# Time-limited credentials shared with the Node signaling server.
use-auth-secret
static-auth-secret=${TURN_SECRET}

# Restrict to IPv4 by default; flip if you need v6.
no-multicast-peers
no-cli
no-loopback-peers

# Relay port range — must be opened in firewall/security group.
min-port=49160
max-port=49200

# TLS certificate paths (Let's Encrypt example). Comment out if you don't have
# a cert yet — TURN-over-UDP will still work without TLS.
#cert=/etc/letsencrypt/live/${PUBLIC_HOST}/fullchain.pem
#pkey=/etc/letsencrypt/live/${PUBLIC_HOST}/privkey.pem
#cipher-list="ECDH+AESGCM:DH+AESGCM:ECDH+AES256:DH+AES256:ECDH+AES128:DH+AES:RSA+AESGCM:RSA+AES:!aNULL:!MD5:!DSS"

fingerprint
lt-cred-mech

# Logging
log-file=stdout
verbose
