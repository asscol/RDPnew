[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "remotedesk-host"
version = "0.1.0"
description = "RemoteDesk host agent: streams the local screen and accepts remote input via WebRTC."
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "RemoteDesk" }]
dependencies = [
  "aiortc>=1.9.0",
  "av>=12.0.0",
  "websockets>=12.0",
  "mss>=9.0.1,<10",
  "pynput>=1.7.7",
  "numpy>=1.26",
  "Pillow>=10.0",
  "aiohttp>=3.9",
]

[project.optional-dependencies]
dev = [
  "ruff>=0.6.0",
  "pyinstaller>=6.10",
  "pytest>=8.0",
]

[project.scripts]
remotedesk-host = "remotedesk.__main__:main"

[tool.setuptools]
packages = ["remotedesk"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]
ignore = ["E501"]
